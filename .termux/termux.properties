# =============================================================================
#  Copyright (c) Anon4You - https://github.com/Anon4You/dotfiles
#  Termux configuration (~/.termux/termux.properties)
#
#  Note:
#    - This controls the Termux app (keyboard shortcuts, cursor, extra keys...).
#    - After editing, run:  termux-reload-settings
#    - The default shell is set separately via:  chsh (not stored here).
#    - font.ttf in this folder is the custom terminal font used by the app.
# =============================================================================

allow-external-apps = true
shortcut.create-session = ctrl + t
shortcut.next-session = ctrl + 2
shortcut.previous-session = ctrl + 1
shortcut.rename-session = ctrl + n
terminal-cursor-blink-rate = 666
terminal-cursor-style = block
terminal-transcript-rows = 50000

extra-keys = [['ESC','/','-',{key: 'HOME', display: '⾕'},{key: 'UP', display: '▲'},'END','PGUP',{key:'KEYBOARD', display: '⌨'}],\
['TAB','CTRL','ALT',{key: 'LEFT', display: '◀'},{key:'DOWN',display:'▼'},{key:'RIGHT', display: '▶'},'PGDN','DRAWER']]